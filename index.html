<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英文單字</title>
<style>
/* ── Variables ─────────────────────────────────────── */
:root {
  --bg:       #f1f5f9;
  --surface:  #ffffff;
  --surface2: #f8fafc;
  --border:   #e2e8f0;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);

  --indigo:   #4f46e5;
  --indigo-d: #4338ca;
  --indigo-l: #eef2ff;
  --green:    #16a34a;
  --green-l:  #f0fdf4;
  --red:      #dc2626;
  --red-l:    #fef2f2;
  --amber:    #d97706;
  --amber-l:  #fffbeb;

  --text:     #0f172a;
  --text2:    #475569;
  --text3:    #94a3b8;

  --r:  12px;
  --r2: 8px;
}

/* ── Reset & Base ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Header ────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow);
}
.header-inner {
  max-width: 1000px; margin: 0 auto;
  padding: 0 24px;
  display: flex; align-items: center; gap: 32px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text);
  padding: 16px 0;
  flex-shrink: 0;
}
.logo-icon { font-size: 24px; }
.logo-text { font-size: 17px; font-weight: 700; }
.logo-sub  { font-size: 11px; color: var(--text3); font-weight: 400; }

nav { display: flex; gap: 2px; flex: 1; }
.nav-link {
  display: flex; align-items: center; gap: 7px;
  padding: 18px 16px; font-size: 14px; font-weight: 500;
  color: var(--text2); cursor: pointer; border: none;
  background: none; border-bottom: 3px solid transparent;
  transition: all .2s; white-space: nowrap;
}
.nav-link:hover { color: var(--indigo); }
.nav-link.active { color: var(--indigo); border-bottom-color: var(--indigo); }
.nav-icon { font-size: 16px; }

.header-streak {
  margin-left: auto; flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  background: var(--amber-l); border: 1px solid #fde68a;
  padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 700; color: var(--amber);
}

/* ── Page wrapper ──────────────────────────────────── */
#page {
  max-width: 1000px; margin: 0 auto;
  padding: 32px 24px 60px;
}

/* ── Cards ─────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
}
.card-sm { padding: 16px 20px; }

/* ── Section header ────────────────────────────────── */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 20px;
}
.section-head h2 { font-size: 20px; font-weight: 700; }
.section-head .sub { font-size: 13px; color: var(--text3); }

/* ── Buttons ───────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px; border-radius: var(--r2); font-size: 14px;
  font-weight: 600; cursor: pointer; border: none; transition: all .18s;
  text-decoration: none;
}
.btn-primary { background: var(--indigo); color: #fff; }
.btn-primary:hover { background: var(--indigo-d); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,.35); }
.btn-primary:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline { background: var(--surface); color: var(--indigo); border: 1.5px solid var(--indigo); }
.btn-outline:hover { background: var(--indigo-l); }
.btn-ghost  { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover  { background: var(--border); color: var(--text); }
.btn-full   { width: 100%; }
.btn-lg { padding: 14px 28px; font-size: 16px; }

/* ── Tags ──────────────────────────────────────────── */
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; letter-spacing: .3px; }
.tag-pos   { background: var(--indigo-l); color: var(--indigo); }
.tag-green { background: var(--green-l);  color: var(--green); }
.tag-red   { background: var(--red-l);    color: var(--red); }
.tag-amber { background: var(--amber-l);  color: var(--amber); }

/* ── Progress bar ──────────────────────────────────── */
.prog-bar-wrap { background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
.prog-bar-fill { height: 6px; background: var(--indigo); border-radius: 99px; transition: width .4s ease; }

.step-dots { display: flex; gap: 5px; }
.step-dot  {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text3);
}
.step-dot.active { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-l); }
.step-dot.done   { background: var(--green); border-color: var(--green); color: #fff; }
.step-dot.wrong  { background: var(--red);   border-color: var(--red);   color: #fff; }

/* ── HOME ──────────────────────────────────────────── */
.home-hero {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  border-radius: var(--r); padding: 36px 32px; color: #fff;
  margin-bottom: 24px; display: flex; align-items: center; gap: 24px;
}
.home-hero-text h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.home-hero-text p  { font-size: 15px; opacity: .8; }
.home-hero-emoji { font-size: 64px; margin-left: auto; flex-shrink: 0; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px 16px; text-align: center;
  box-shadow: var(--shadow);
}
.stat-num   { font-size: 32px; font-weight: 800; color: var(--indigo); }
.stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; font-weight: 500; }

.today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 600px) { .today-grid { grid-template-columns: 1fr; } }

.today-prog-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }

.wrong-list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.wrong-list-item:last-child { border-bottom: none; }

/* ── LEARN ─────────────────────────────────────────── */
.learn-layout {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  align-items: start;
}
@media (max-width: 680px) { .learn-layout { grid-template-columns: 1fr; } }

.word-hero {
  background: linear-gradient(145deg, #4f46e5, #7c3aed);
  border-radius: var(--r); padding: 36px 24px; text-align: center; color: #fff;
  box-shadow: var(--shadow-md);
}
.word-hero-word { font-size: 42px; font-weight: 800; letter-spacing: .5px; margin-bottom: 8px; }
.word-hero-phonetic { font-size: 16px; opacity: .75; margin-bottom: 20px; }
.tts-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 20px; border-radius: 20px;
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.35);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .2s;
}
.tts-btn:hover, .tts-btn.playing { background: rgba(255,255,255,.32); border-color: #fff; }

.meaning-block {
  background: var(--indigo-l); border-radius: var(--r2);
  padding: 16px 18px; margin-bottom: 14px;
  border-left: 4px solid var(--indigo);
}
.meaning-pos { font-size: 11px; font-weight: 700; color: var(--indigo); margin-bottom: 6px; }
.meaning-zh  { font-size: 22px; font-weight: 700; color: var(--text); }

.example-block {
  background: var(--surface2); border-radius: var(--r2); padding: 16px 18px;
  font-size: 15px; line-height: 1.8; color: var(--text2);
  border: 1px solid var(--border);
}
.example-block .hl { color: var(--indigo); font-weight: 700; border-bottom: 2px solid var(--indigo); }

.example-tts-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; padding: 5px 12px; border-radius: 20px;
  background: var(--border); border: none; font-size: 12px;
  color: var(--text2); cursor: pointer; transition: all .2s;
}
.example-tts-btn:hover { background: var(--indigo-l); color: var(--indigo); }

.learn-nav { display: flex; gap: 10px; margin-top: 20px; }

/* ── QUIZ ──────────────────────────────────────────── */
.quiz-layout {
  max-width: 640px; margin: 0 auto;
}
.quiz-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.quiz-header-row h2 { font-size: 18px; font-weight: 700; }
.score-pill {
  background: var(--green-l); color: var(--green);
  border: 1px solid #bbf7d0; border-radius: 20px;
  padding: 5px 14px; font-size: 14px; font-weight: 700;
}

.quiz-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow-md); padding: 32px;
}
.quiz-hint-label {
  font-size: 12px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px;
}
.blank-sentence {
  font-size: 18px; line-height: 2; color: var(--text);
  padding: 16px 20px; background: var(--surface2);
  border-radius: var(--r2); margin-bottom: 8px;
  border: 1px solid var(--border);
}
.blank-token {
  display: inline-block; min-width: 90px; border-bottom: 2.5px solid var(--indigo);
  color: var(--indigo); font-weight: 700; text-align: center; padding: 0 6px;
}
.zh-hint {
  font-size: 13px; color: var(--text3); margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}

.quiz-input {
  width: 100%; padding: 16px 20px;
  font-size: 20px; font-weight: 700; text-align: center; letter-spacing: 2px;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: var(--r2); color: var(--text); outline: none;
  transition: border-color .2s, background .2s;
  font-family: inherit;
}
.quiz-input:focus { border-color: var(--indigo); background: var(--surface); }
.quiz-input.correct { border-color: var(--green); background: var(--green-l); color: var(--green); }
.quiz-input.wrong   { border-color: var(--red);   background: var(--red-l);   color: var(--red); }

.quiz-actions { display: flex; gap: 10px; margin-top: 14px; }

/* ── CHOICE BUTTONS ────────────────────────────────── */
.choice-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 4px; }
.choice-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--surface);
  cursor: pointer; font-size: 15px; text-align: left; width: 100%;
  transition: border-color .15s, background .15s; font-family: inherit;
}
.choice-btn:hover:not(:disabled) { border-color: var(--indigo); background: var(--indigo-l); }
.choice-label {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--indigo-l); color: var(--indigo); font-weight: 700; font-size: 13px;
}
.choice-btn.reveal  { border-color: var(--green); background: var(--green-l); }
.choice-btn.reveal .choice-label { background: var(--green); color: #fff; }
.choice-btn.wrong   { border-color: var(--red);   background: var(--red-l); }
.choice-btn.wrong .choice-label  { background: var(--red); color: #fff; }
.choice-btn:disabled { cursor: default; opacity: .85; }

.feedback-box {
  margin-top: 16px; padding: 14px 18px; border-radius: var(--r2);
  font-size: 14px; display: none; line-height: 1.6;
}
.feedback-box.show { display: block; }
.feedback-box.correct { background: var(--green-l); border: 1px solid #bbf7d0; color: #15803d; }
.feedback-box.wrong   { background: var(--red-l);   border: 1px solid #fecaca; }
.feedback-box .ans    { font-size: 18px; font-weight: 800; color: var(--green); }
.feedback-box .ans-wrong { font-size: 18px; font-weight: 800; color: var(--red); }

/* ── GLOSS PANEL ───────────────────────────────────── */
.gloss-panel {
  margin-top: 14px; padding: 14px 16px;
  background: var(--surface2); border-radius: var(--r2);
  border: 1px solid var(--border);
}
.gloss-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.gloss-item {
  text-align: center; padding: 6px 10px;
  background: var(--surface); border-radius: 8px;
  border: 1px solid var(--border); min-width: 48px;
}
.gloss-item.target { border-color: var(--indigo); background: var(--indigo-l); }
.gloss-word { font-size: 13px; font-weight: 600; color: var(--text1); }
.gloss-item.target .gloss-word { color: var(--indigo); font-weight: 800; }
.gloss-zh   { font-size: 11px; color: var(--text3); margin-top: 2px; white-space: nowrap; }
.gloss-item.target .gloss-zh { color: var(--indigo); }

/* ── RESULTS ───────────────────────────────────────── */
.results-hero {
  text-align: center; padding: 48px 24px 32px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  border-radius: var(--r); color: #fff; margin-bottom: 24px;
  box-shadow: var(--shadow-md);
}
.results-emoji  { font-size: 56px; margin-bottom: 12px; }
.results-score  { font-size: 72px; font-weight: 900; line-height: 1; }
.results-denom  { font-size: 28px; font-weight: 400; opacity: .7; }
.results-label  { font-size: 18px; opacity: .85; margin-top: 8px; }

.result-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.result-row:last-child { border-bottom: none; }
.result-status { font-size: 20px; }
.result-word   { font-size: 16px; font-weight: 700; flex: 1; }
.result-zh     { font-size: 13px; color: var(--text2); }
.result-tts    { font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 50%; border: none; background: none; transition: background .15s; }
.result-tts:hover { background: var(--indigo-l); }

/* ── HISTORY ───────────────────────────────────────── */
.hist-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 680px) { .hist-grid { grid-template-columns: 1fr; } }

.hist-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }

.cal-wrapper { }
.cal-labels  { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 4px; }
.cal-label   { font-size: 10px; color: var(--text3); text-align: center; font-weight: 600; }
.cal-grid    { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-cell    {
  aspect-ratio: 1; border-radius: 4px;
  background: var(--surface2); border: 1px solid var(--border);
  transition: background .2s;
}
.cal-cell.done  { background: var(--indigo); border-color: var(--indigo); }
.cal-cell.today { box-shadow: 0 0 0 2px var(--amber); }
.cal-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11px; color: var(--text3); align-items: center; }
.leg-dot { width: 12px; height: 12px; border-radius: 3px; }

.wrong-word-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.wrong-word-row:last-child { border-bottom: none; }
.ww-word  { font-weight: 700; flex: 1; }
.ww-zh    { font-size: 12px; color: var(--text2); }
.ww-badge { background: var(--red-l); color: var(--red); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

.speed-wrap { display: flex; align-items: center; gap: 12px; }
.speed-wrap input[type=range] { flex: 1; accent-color: var(--indigo); }
.speed-val { font-size: 14px; font-weight: 700; color: var(--indigo); min-width: 36px; }

/* ── Misc ──────────────────────────────────────────── */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.text-sm { font-size: 13px; color: var(--text2); }
.mt-1 { margin-top: 6px; }
.mt-2 { margin-top: 12px; }
.mt-3 { margin-top: 20px; }
.flex-end { display: flex; justify-content: flex-end; }

/* fade-in animation */
.fade { animation: fadeUp .28s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* responsive nav label hiding */
@media (max-width: 480px) {
  .nav-link { padding: 16px 10px; font-size: 12px; gap: 4px; }
  .header-streak { display: none; }
  #page { padding: 20px 14px 40px; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">📚</span>
      <div>
        <div class="logo-text">每日英文單字</div>
        <div class="logo-sub">每天 10 個 · TOEIC 核心詞彙</div>
      </div>
    </div>
    <nav>
      <button class="nav-link active" id="nav-home"    onclick="go('home')">   <span class="nav-icon">🏠</span> 首頁</button>
      <button class="nav-link"        id="nav-learn"   onclick="go('learn')">  <span class="nav-icon">📖</span> 學習</button>
      <button class="nav-link"        id="nav-quiz"    onclick="go('quiz')">   <span class="nav-icon">✏️</span> 測驗</button>
      <button class="nav-link"        id="nav-history" onclick="go('history')"><span class="nav-icon">📊</span> 紀錄</button>
    </nav>
    <div class="header-streak" id="header-streak">🔥 <span id="streak-num">0</span> 天</div>
  </div>
</header>

<!-- Main page -->
<main id="page"></main>

<script>

[11,"application","/ˌæplɪˈkeɪʃn/","n.","申請；應用","She submitted her {w} for the marketing position last week.","她上週提交了行銷職位的申請。"],

function buildGloss(sentence, targetWord){
  const tgt=targetWord.toLowerCase();
  const tokens=(sentence.match(/[\w']+|[.,!?;:]/g)||[]);
  return tokens.map(tok=>{
    if(/^[.,!?;:]$/.test(tok)) return {word:tok,zh:'',punct:true};
    // Strip possessive 's first, then remaining apostrophes
    const bare=tok.replace(/'s$/i,'').replace(/'/g,'').toLowerCase();
    const isTarget=bare===tgt||tok.toLowerCase().replace(/'s$/i,'')===tgt;
    // Lookup chain: WORDS → COMMON → try without trailing -s/-ed/-ing
    let zh=null;
    const wEntry=ALL_WORDS.find(x=>x.word.toLowerCase()===bare);
    if(wEntry) zh=wEntry.zh;
    if(!zh) zh=COMMON[bare]||null;
    if(!zh){
      // Try common stemming
      const stems=[
        bare.replace(/s$/,''),
        bare.replace(/es$/,''),
        bare.replace(/ies$/,'y'),
        bare.replace(/ing$/,''),
        bare.replace(/ed$/,''),
        bare.replace(/er$/,''),
      ];
      for(const s of stems){
        const we=ALL_WORDS.find(x=>x.word.toLowerCase()===s);
        if(we){zh=we.zh;break;}
        if(COMMON[s]){zh=COMMON[s];break;}
      }
    }
    return {word:tok, zh, isTarget, punct:false};
  });
}

const S = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
const today=()=>new Date().toISOString().slice(0,10);

function getSession(){
  const t=today();
  let s=S.get('sess',null);
  if(!s||s.date!==t){
    s={date:t,wordIds:pickWords(),learned:[],results:{},done:false};
    S.set('sess',s);
    bumpStreak(t);
  }
  return s;
}
function saveSession(s){S.set('sess',s);}

function pickFrom(bank, recentKey, n){
  const recent=S.get(recentKey,[]);
  const pool=bank.filter(w=>!recent.includes(w.id));
  const src=pool.length>=n?pool:bank;
  const ids=[...src].sort(()=>Math.random()-.5).slice(0,n).map(w=>w.id);
  S.set(recentKey,[...new Set([...recent,...ids])].slice(-40));
  return ids;
}
function pickWords(){
  const toeicIds=pickFrom(WORDS,'recent_toeic',10);
  const nbaIds=pickFrom(NBA_WORDS,'recent_nba',10);
  return [...toeicIds,...nbaIds];
}

function bumpStreak(t){
  let hist=S.get('hist',{});
  if(!hist[t]) hist[t]={score:null,done:false};
  S.set('hist',hist);
  // streak calc
  let streak=0,d=new Date(t);
  while(hist[d.toISOString().slice(0,10)]){streak++;d.setDate(d.getDate()-1);}
  S.set('streak',streak);
  document.getElementById('streak-num').textContent=streak;
}

function markDone(date,score){
  let hist=S.get('hist',{});
  hist[date]={score,done:true};
  S.set('hist',hist);
}
function addWrong(id){
  let ww=S.get('wrong',{});ww[id]=(ww[id]||0)+1;S.set('wrong',ww);
}

// TTS
// ════════════════════════════════════════════════════
let ttsSpeed=parseFloat(S.get('ttsSpeed',0.9));
let selectedVoiceURI=S.get('voiceURI','');
let activeTts=null;

function pickBestVoice(voices){
  // Priority: saved preference → Google quality voices → en-US → any English
  if(selectedVoiceURI){
    const v=voices.find(v=>v.voiceURI===selectedVoiceURI);
    if(v)return v;
  }
  const pref=['Google US English','Microsoft Aria Online','Microsoft Guy Online',
    'Google UK English Female','Google UK English Male','Samantha','Alex'];
  for(const name of pref){
    const v=voices.find(v=>v.name===name);
    if(v)return v;
  }
  // fallback: any Google voice in English
  return voices.find(v=>v.name.startsWith('Google')&&v.lang.startsWith('en'))
    ||voices.find(v=>v.lang==='en-US')
    ||voices.find(v=>v.lang.startsWith('en'))
    ||null;
}

function speak(text,btnEl){
  if(!('speechSynthesis' in window))return;
  if(activeTts){activeTts.classList.remove('playing');activeTts.textContent=activeTts.dataset.label||'🔊 發音';}
  if(activeTts===btnEl&&speechSynthesis.speaking){speechSynthesis.cancel();activeTts=null;return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=ttsSpeed;
  const voices=speechSynthesis.getVoices();
  const v=pickBestVoice(voices);
  if(v)u.voice=v;
  if(btnEl){
    btnEl.dataset.label=btnEl.textContent;
    btnEl.classList.add('playing');
    btnEl.textContent='⏹ 停止';
    activeTts=btnEl;
  }
  u.onend=()=>{
    if(btnEl){btnEl.classList.remove('playing');btnEl.textContent=btnEl.dataset.label||'🔊 發音';}
    if(activeTts===btnEl)activeTts=null;
  };
  speechSynthesis.speak(u);
}

function selectVoice(uri){
  selectedVoiceURI=uri;
  S.set('voiceURI',uri);
  renderHistory();
}

function previewVoice(uri){
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.voiceURI===uri);
  if(!v)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('Hello! This is a pronunciation test.');
  u.lang='en-US'; u.rate=ttsSpeed; u.voice=v;
  speechSynthesis.speak(u);
}

function getEnVoices(){
  return speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
}

let screen='home',learnIdx=0,quizIdx=0,quizAnswered=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function go(s){
  speechSynthesis.cancel(); activeTts=null;
  screen=s;
  if(s==='learn')learnIdx=0;
  if(s==='quiz'){
    quizIdx=0; quizAnswered=false;
    const sess=getSession();
    if(!sess.quizOrder){sess.quizOrder=shuffle([...sess.wordIds]);saveSession(sess);}
  }
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+s)?.classList.add('active');
  render();
}

function learnNav(dir){
  const sess=getSession();
  const words=sess.wordIds.map(id=>ALL_WORDS.find(w=>w.id===id));
  const w=words[learnIdx];
  if(!sess.learned.includes(w.id)){sess.learned.push(w.id);saveSession(sess);}
  const total=sess.wordIds.length;
  if(dir===1&&learnIdx>=total-1){go('home');return;}
  learnIdx=Math.max(0,Math.min(total-1,learnIdx+dir));
  render();
}

function buildChoices(wordId, sess){
  if(!sess.choices) sess.choices={};
  // Invalidate stale cache (old format had zh but no word)
  if(sess.choices[wordId] && !sess.choices[wordId][0]?.word) delete sess.choices[wordId];
  if(sess.choices[wordId]) return sess.choices[wordId];
  const w=ALL_WORDS.find(x=>x.id===wordId);
  let pool=shuffle(ALL_WORDS.filter(x=>x.id!==wordId&&x.pos===w.pos&&x.cat===w.cat));
  // If not enough same-pos same-cat words, fall back to any same-cat word
  if(pool.length<2) pool=shuffle(ALL_WORDS.filter(x=>x.id!==wordId&&x.cat===w.cat));
  const distractors=pool.slice(0,2);
  const opts=shuffle([
    {id:w.id, word:w.word, correct:true},
    ...distractors.map(x=>({id:x.id, word:x.word, correct:false}))
  ]);
  sess.choices[wordId]=opts;
  return opts;
}

function checkQ(wordId, selectedOptId){
  const w=ALL_WORDS.find(x=>x.id===wordId);
  const ok=(selectedOptId===wordId);
  const sess=getSession();
  sess.results[wordId]=ok;
  if(!sess.selectedChoices) sess.selectedChoices={};
  sess.selectedChoices[wordId]=selectedOptId;
  saveSession(sess);
  if(!ok) addWrong(wordId);
  quizAnswered=true;
  render();
}
function nextQ(){
  const sess=getSession();
  const total=sess.wordIds.length;
  quizIdx++;quizAnswered=false;
  if(quizIdx>=total){finalizeQuiz();return;}
  render();
}
function finalizeQuiz(){
  const sess=getSession();
  sess.done=true;saveSession(sess);
  const score=Object.values(sess.results).filter(Boolean).length;
  markDone(sess.date,score);
  renderResults();
}

function renderHistory(){
  const streak=S.get('streak',0);
  const hist=S.get('hist',{});
  const totalDays=Object.keys(hist).length;
  const scores=Object.values(hist).map(h=>h.score).filter(s=>s!==null);
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
  const wrongData=S.get('wrong',{});
  const topWrong=Object.entries(wrongData).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Calendar: last 5 weeks (35 days)
  const t=today();
  const calStart=new Date(t);calStart.setDate(calStart.getDate()-34);
  const calDays=[];
  for(let i=0;i<=34;i++){
    const d=new Date(calStart);d.setDate(calStart.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    calDays.push({ds,done:!!hist[ds]?.done,today:ds===t});
  }
  const startDow=calStart.getDay(); // day of week offset

  document.getElementById('page').innerHTML=`
  <div class="section-head fade"><h2>📊 學習紀錄</h2></div>

  <div class="hist-stats fade">
    <div class="stat-card"><div class="stat-num">🔥 ${streak}</div><div class="stat-label">連續天數</div></div>
    <div class="stat-card"><div class="stat-num">${totalDays}</div><div class="stat-label">學習天數</div></div>
    <div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-label">平均分數</div></div>
  </div>

  <div class="hist-grid fade">
    <div>
      <div class="card">
        <div class="section-head" style="margin-bottom:12px"><h2 style="font-size:16px">近 5 週出勤</h2></div>
        <div class="cal-labels">
          ${['日','一','二','三','四','五','六'].map(d=>`<div class="cal-label">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">
          ${Array(startDow).fill('<div></div>').join('')}
          ${calDays.map(d=>`<div class="cal-cell ${d.done?'done':''} ${d.today?'today':''}" title="${d.ds}"></div>`).join('')}
        </div>
        <div class="cal-legend">
          <span><span class="leg-dot" style="background:var(--indigo);display:inline-block"></span> 完成</span>
          <span><span class="leg-dot" style="background:var(--surface2);border:1px solid var(--border);display:inline-block"></span> 未學習</span>
          <span><span class="leg-dot" style="border:2px solid var(--amber);display:inline-block"></span> 今天</span>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="section-head" style="margin-bottom:12px"><h2 style="font-size:16px">常錯單字</h2></div>
        ${topWrong.length===0
          ?'<div class="text-sm" style="color:var(--text3)">還沒有錯誤紀錄，繼續加油！</div>'
          :topWrong.map(([id,cnt])=>{
            const w=ALL_WORDS.find(x=>x.id==id);
            return w?`<div class="wrong-word-row">
              <button class="btn btn-ghost" style="padding:5px 10px;font-size:12px;flex-shrink:0" onclick="speak('${w.word}',this)">🔊</button>
              <div style="flex:1;min-width:0"><div class="ww-word">${w.word}</div><div class="ww-zh">${w.zh}</div></div>
              <span class="ww-badge">${cnt} 次</span>
            </div>`:'';
          }).join('')
        }
      </div>

      <div class="card">
        <div class="section-head" style="margin-bottom:12px"><h2 style="font-size:16px">語音設定</h2></div>
        <div style="margin-bottom:14px">
          <div class="text-sm" style="margin-bottom:6px;font-weight:600;color:var(--text2)">語速</div>
          <div class="speed-wrap">
            <span class="text-sm">慢</span>
            <input type="range" min="0.5" max="1.5" step="0.1" value="${ttsSpeed}"
              oninput="ttsSpeed=parseFloat(this.value);S.set('ttsSpeed',this.value);document.getElementById('spd').textContent=this.value+'x'">
            <span class="text-sm">快</span>
            <span class="speed-val" id="spd">${ttsSpeed}x</span>
          </div>
        </div>
        <div>
          <div class="text-sm" style="margin-bottom:8px;font-weight:600;color:var(--text2)">語音選擇 <span style="font-weight:400;color:#94a3b8">（選清楚的語音，建議 Google US English）</span></div>
          <div id="voice-list" style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto">
            ${(()=>{
              const vs=getEnVoices();
              if(!vs.length)return '<p class="text-sm" style="color:#94a3b8;padding:8px 0">瀏覽器語音載入中，請稍後重新整理</p>';
              const cur=selectedVoiceURI||(pickBestVoice(vs)||{}).voiceURI||'';
              return vs.map(v=>{
                const isSelected=v.voiceURI===cur;
                const isGoogle=v.name.startsWith('Google');
                return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1.5px solid ${isSelected?'var(--indigo)':'var(--border)'};background:${isSelected?'var(--indigo-l)':'var(--surface2)'}">
                  <div style="flex:1;min-width:0">
                    <div style="font-size:13px;font-weight:600;color:var(--text1)">${v.name}${isGoogle?' ⭐':''}</div>
                    <div style="font-size:11px;color:#94a3b8">${v.lang}${v.localService?' · 離線可用':' · 線上語音'}</div>
                  </div>
                  <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;flex-shrink:0" onclick="previewVoice('${v.voiceURI.replace(/'/g,"\\'")}')">試聽</button>
                  ${isSelected
                    ?'<span style="font-size:12px;color:var(--indigo);font-weight:600;padding:4px 8px">✓ 使用中</span>'
                    :`<button class="btn btn-primary" style="padding:4px 10px;font-size:12px;flex-shrink:0" onclick="selectVoice('${v.voiceURI.replace(/'/g,"\\'")}')">選擇</button>`
                  }
                </div>`;
              }).join('');
            })()}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
// Router
// ════════════════════════════════════════════════════
function render(){
  const p=document.getElementById('page');
  p.style.opacity='0';
  setTimeout(()=>{
    if(screen==='home')renderHome();
    else if(screen==='learn')renderLearn();
    else if(screen==='quiz')renderQuiz();
    else if(screen==='history')renderHistory();
    p.style.opacity='1';
    p.style.transition='opacity .2s';
  },60);
}

// Init
document.getElementById('streak-num').textContent=S.get('streak',0);
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>{};
setTimeout(()=>speechSynthesis.getVoices(),300);
render();
</script>
</body>
</html>
